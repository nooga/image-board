name: Deploy to Monk Cluster

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

concurrency:
  group: image-board-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-go@v5
      with:
        go-version-file: backend/go.mod
        cache-dependency-path: backend/go.sum
    - run: go test ./...
      working-directory: backend
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - run: npm ci && npm run build
      working-directory: frontend

  build-images:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: monk-io/monk-actions/build-images@v1
      with:
        registry-address: ${{ secrets.REGISTRY_ADDRESS }}
        registry-username: ${{ secrets.REGISTRY_USERNAME }}
        registry-password: ${{ secrets.REGISTRY_PASSWORD }}
        registry-tls-verify: ${{ secrets.REGISTRY_TLS_VERIFY }}

  deploy:
    if: github.event_name == 'push'
    needs: build-images
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: monk-io/monk-actions/deploy@v1
      with:
        monkcode: ${{ secrets.MONKCODE }}
        service-token: ${{ secrets.MONK_SERVICE_TOKEN }}
        workload: "image-board/prod"
        branch-tag: "default"
        capsule-mode: static
